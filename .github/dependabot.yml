version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 3
    groups:
      discord:
        patterns:
          - 'seyfert'
  - package-ecosystem: 'docker'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: 'actions/setup-node'
        versions: ['6.x']
