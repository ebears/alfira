name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.zed/**'
      - '.pi/**'
      - 'LICENSE'
      - '.git-commit-template'
      - '.env.example'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.zed/**'
      - '.pi/**'
      - 'LICENSE'
      - '.git-commit-template'
      - '.env.example'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy — dependency vulns + secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint, typecheck, and format check
        run: bun run check
      - name: Build server
        run: bun run --filter @alfira/server build
      - name: Build web
        run: bun run --filter @alfira/web build
