name: Dependabot — Update Bun Lockfile

on:
  pull_request:
    paths:
      - 'package.json'
      - 'packages/*/package.json'

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Regenerate bun.lock
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Regenerate lockfile
        run: bun install

      - name: Commit updated bun.lock
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v5
        with:
          commit_message: 'chore: update bun.lock'
          file_pattern: bun.lock
