# ---------------------------------------------------------------------------
# Production docker-compose — full stack
#
# Setup:
#   1. Copy .env.example to .env and fill in your values
#   2. Run: docker compose -f docker-compose.prod.yml up -d
#
# To build from source instead of pulling the pre-built image:
#   - Set ALFIRA_IMAGE=alfira:local in your .env
#   - Uncomment the "build" block below and comment out "image"
#   - Run: docker compose -f docker-compose.prod.yml build && docker compose -f docker-compose.prod.yml up -d
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
# ---------------------------------------------------------------------------
services:
  alfira:
    image: ${ALFIRA_IMAGE:-ghcr.io/ebears/alfira:latest}
    # Uncomment to build from source instead:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/alfira.db
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      WEB_UI_ORIGIN: ${WEB_UI_ORIGIN}
      VOICE_IDLE_TIMEOUT_MINUTES: ${VOICE_IDLE_TIMEOUT_MINUTES:-5}
      GUILD_ID: ${GUILD_ID}
      ADMIN_ROLE_IDS: ${ADMIN_ROLE_IDS}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - 8180:3001
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
